services:
   db:
    image: postgres:13.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cookbook_db
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data

   backend:
    build:
       context: ./server
       ports:
        - "3001:3000"
       environment:
        - DB_HOST=db
        - DB_PORT=5432
        - DB_USERNAME=postgres
        - DB_PASSWORD=postgres
        - DB_NAME=cookbook_db
        - JWT_SECRET=your_jwt_secret
   frontend:
      build:
        context: ./client
      ports:
        - "3000:3000"

volumes:
  db-data:

  
